[package]
name = "daw-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rill"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
daw-core.workspace = true
daw-engine.workspace = true
daw-plugins.workspace = true
daw-ui.workspace = true
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[dev-dependencies]
tempfile = "3"
