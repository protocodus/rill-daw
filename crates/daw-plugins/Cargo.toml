[package]
name = "daw-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
daw-ui.workspace = true
png = "=0.18.1"
sha2 = "=0.10.9"
vst3-host = { version = "=0.10.0", default-features = false, features = ["process-isolation"] }
clack-host = "=0.2.0"
clack-extensions = { version = "=0.2.0", features = ["clack-host", "audio-ports", "note-ports", "params", "state", "latency", "tail", "gui", "timer", "thread-check", "log", "render"] }

[[bin]]
name = "daw-plugin-host"
path = "src/bin/daw-plugin-host.rs"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSWindow", "NSView", "NSEvent", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSGeometry", "NSDate", "NSRunLoop", "NSData", "NSDictionary", "NSBundle", "NSURL"] }
block2 = "0.6"
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = ["std", "bitflags", "block2", "objc2-core-audio-types", "objc2-core-foundation", "AUComponent", "AudioComponent", "AudioUnitProperties", "AudioUnitUtilities", "MusicDevice"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "bitflags", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFData", "CFDate", "CFError", "CFPropertyList", "CFRunLoop", "CFString"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
clack-extensions = { version = "=0.2.0", features = ["posix-fd"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "=0.8.9"
x11rb = { version = "=0.13.2", features = ["image", "res", "composite"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "=0.13.2", features = ["xtest"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
