[package]
name = "daw-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
daw-core.workspace = true
daw-plugins.workspace = true
cpal = "0.18.2"
hound = "3.5"
flacenc = { version = "=0.5.1", default-features = false }
vorbis_rs = { version = "=0.5.6", default-features = false }
rusty_mp3 = "=1.0.5"
serde.workspace = true
rubato = "=5.0.1"
midir = "=0.11.0"
rustfft = "=6.4.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
coremidi = "=0.9.2"

[build-dependencies]
cc = "=1.10.0"
