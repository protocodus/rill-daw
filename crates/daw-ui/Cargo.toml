[package]
name = "daw-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
glow-backdrop = ["dep:egui_glow"]

[dependencies]
egui = "=0.33.3"
egui_glow = { version = "=0.33.3", optional = true, default-features = false }
serde.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSEvent"] }
objc2-foundation = { version = "0.3.2", features = ["NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[[test]]
name = "native_dialog_menu"
harness = false
