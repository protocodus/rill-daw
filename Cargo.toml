[workspace]
members = ["crates/daw-core", "crates/daw-engine", "crates/daw-plugins", "crates/daw-ui", "crates/daw-app", "crates/daw-tools", "crates/daw-mcp", "crates/daw-ai"]
exclude = ["vendor/vst3-host"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
daw-core = { path = "crates/daw-core" }
daw-engine = { path = "crates/daw-engine" }
daw-plugins = { path = "crates/daw-plugins" }
daw-ui = { path = "crates/daw-ui" }
daw-tools = { path = "crates/daw-tools" }
daw-mcp = { path = "crates/daw-mcp" }
daw-ai = { path = "crates/daw-ai" }

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
# Host-provided VST parameter context-menu actions; see vendor/vst3-host/RILL-PATCH.md.
vst3-host = { path = "vendor/vst3-host" }
