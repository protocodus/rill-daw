[workspace]
members = ["crates/daw-core", "crates/daw-engine", "crates/daw-plugins", "crates/daw-ui", "crates/daw-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
daw-core = { path = "crates/daw-core" }
daw-engine = { path = "crates/daw-engine" }
daw-plugins = { path = "crates/daw-plugins" }
daw-ui = { path = "crates/daw-ui" }

[profile.release]
lto = "thin"
codegen-units = 1
