name: Set up Rill CI
description: Install the Rust toolchain and native dependencies and isolate test settings.
runs:
  using: composite
  steps:
    - name: Configure Cargo and isolate application settings
      shell: bash
      run: |
        # Keep the hundreds of test executables small enough for a hosted runner.
        echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
        echo "RUST_BACKTRACE=1" >> "$GITHUB_ENV"
        echo "RILL_CONFIG_DIR=$RUNNER_TEMP/rill-ci-config" >> "$GITHUB_ENV"
        echo "RILL_CACHE_DIR=$RUNNER_TEMP/rill-ci-cache" >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - name: Linux system libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ pkg-config libasound2-dev libjack-jackd2-dev libudev-dev libxkbcommon-dev libwayland-dev \
          libx11-6 libx11-xcb1 libxi6 libxcursor1 libxrandr2 libxkbcommon-x11-0 \
          libgl1 libegl1 libegl-mesa0 libgl1-mesa-dri libglx-mesa0 xvfb xauth liblilv-0-0
