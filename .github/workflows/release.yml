name: Release distributions

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks-and-packages:
    uses: ./.github/workflows/ci.yml

  publish:
    # A manual run validates/builds artifacts only. Publishing requires a pushed tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: checks-and-packages
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rill-*
          merge-multiple: true
          path: release-assets
      - name: Verify version, complete asset set, and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = re.search(r'(?m)^version = "([^"]+)"', pathlib.Path('Cargo.toml').read_text()).group(1)
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag must match workspace package version'
          targets = {
              'aarch64-apple-darwin': 'zip', 'x86_64-apple-darwin': 'zip',
              'aarch64-unknown-linux-gnu': 'tar.gz', 'x86_64-unknown-linux-gnu': 'tar.gz',
              'x86_64-pc-windows-msvc': 'zip',
          }
          expected = set()
          for target, extension in targets.items():
              filename = f'rill-{version}-{target}.{extension}'
              expected.update((filename, f'{filename}.sha256'))
          found = {path.name for path in pathlib.Path('release-assets').iterdir() if path.is_file()}
          assert found == expected, f'Unexpected release asset set: missing={expected-found}, extra={found-expected}'
          PY
          cd release-assets
          sha256sum --check -- *.sha256
      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite published binaries.' >&2
            exit 1
          fi
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --title "Rill $RELEASE_TAG" --generate-notes "${prerelease[@]}"
