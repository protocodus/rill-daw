name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux build, lint and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Linux launcher installation tests
        run: python3 scripts/test-desktop-install.py
      - name: Build application and isolated plug-in host
        run: cargo build --locked --workspace
      - name: Capture every screen and dialog
        run: xvfb-run -a -s "-screen 0 1600x1200x24" bash scripts/capture-screens.sh target/screens
      - name: Upload screens
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: target/screens
          if-no-files-found: error
          retention-days: 14
      - name: Workspace unit tests
        run: cargo test --locked --workspace --lib --bins
      - name: Headless smoke tests
        run: cargo test --locked -p daw-app --test e2e --test master_meter_e2e -- --test-threads=1
      - name: Strict Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  publish-screens:
    name: Publish README screens
    # The README shows these images from the screens branch, so every main
    # build refreshes them without committing binaries to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: screens
          path: screens
      - name: Replace the screens branch
        working-directory: screens
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Screens of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:screens
